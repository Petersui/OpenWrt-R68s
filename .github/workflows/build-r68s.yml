name: Build LEDE for FastRhino R68S

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * 0'

permissions:
  contents: write

jobs:
  build:
    name: Build R68S firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout build config
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gcc-multilib g++-multilib gawk \
            gettext git libncurses5-dev libncursesw5-dev libssl-dev \
            python3 python3-pyelftools python3-setuptools rsync swig unzip \
            zlib1g-dev file wget curl libelf-dev autoconf automake autopoint \
            libtool-bin pkgconf bzip2 cpio patch device-tree-compiler \
            squashfs-tools libfuse-dev texinfo help2man qemu-utils \
            libltdl-dev libgmp3-dev libmpfr-dev libmpc-dev ccache upx-ucl \
            xxd intltool gperf libreadline-dev libglib2.0-dev
          python3 --version
          ccache --version | head -1
          df -h /

      - name: Clone LEDE (coolsnowwolf/lede master)
        run: git clone --depth 1 -b master https://github.com/coolsnowwolf/lede.git lede

      - name: Patch broken legacy fs kmods (ntfs / reiserfs)
        run: |
          cd lede
          FS=package/kernel/linux/modules/fs.mk
          for k in fs-ntfs fs-reiserfs; do
            sed -i "/^define KernelPackage\/${k}\$/ , /^endef\$/d" "$FS"
            sed -i "/^define KernelPackage\/${k}\/description/ , /^endef\$/d" "$FS"
            sed -i "/call KernelPackage,${k})/d" "$FS"
            echo "  [已剔除] kmod-${k}（当前内核已无对应驱动，6.18 只剩 ntfs3）"
          done
          grep -n "fs-ntfs\b\|fs-reiserfs" "$FS" || echo "  fs.mk 已无 ntfs/reiserfs 定义"
          ls fs 2>/dev/null || true

      - name: Configure target, feeds and packages
        run: |
          cd lede
          cp ../configs/r68s.config .config
          bash ../scripts/diy-part1.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -d y -p istore luci-app-store || true
          bash ../scripts/diy-part2.sh
          make defconfig
          echo "=========== 精简配置 ==========="
          # LEDE feeds 新包默认 y（整配约 9900 个，编不完 6 小时），只保留 configs 里显式启用的项 + 必需基础包
          grep '^CONFIG_PACKAGE_.*=y$' ../configs/r68s.config | sed -e 's/^CONFIG_//' -e 's/=y$//' | sort -u > ../keep.txt
          for p in luci-app-store luci-app-dockerman luci-i18n-dockerman-zh-cn luci-lib-taskd luci-lib-xterm taskd docker dockerd docker-compose luci luci-base luci-compat; do echo "PACKAGE_${p}" >> ../keep.txt; done
          sort -u ../keep.txt -o ../keep.txt
          echo "保留白名单包数: $(wc -l < ../keep.txt)"
          awk 'NR==FNR { k[$0]=1; next }
               /^CONFIG_PACKAGE_[A-Za-z0-9_.+-]*=y$/ { n=$0; sub(/^CONFIG_/,"",n); sub(/=y$/,"",n); if (n in k) print $0; else print "# CONFIG_" n " is not set"; next }
               { print }' ../keep.txt .config > .config.slim
          mv .config.slim .config
          make defconfig
          echo "精简后启用包数: $(grep -c '^CONFIG_PACKAGE_.*=y' .config)"
          for p in kmod-fs-ntfs kmod-fs-reiserfs; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then echo "::error::${p} 仍未关闭"; exit 1; else echo "  [已关闭] ${p}"; fi
          done
          echo "=========== 关键包自检 ==========="
          miss=0
          for p in luci-app-store luci-app-dockerman docker dockerd luci-lib-taskd taskd; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "  [OK]      ${p}"
            else
              echo "::warning::[MISSING] ${p}"
              miss=1
            fi
          done
          if [ "$miss" = "1" ]; then
            echo "::error::有包没进配置，检查 feeds/istore"
            exit 1
          fi
          grep -E "^CONFIG_TARGET_rockchip|DEVICE_fastrhino" .config
          echo "=========== 精简检查 ==========="
          echo "启用包总数: $(grep -c '^CONFIG_PACKAGE_.*=y' .config)"
          for p in rust mariadb-server clamav spamassassin libpam node; do
            if grep -q "^# CONFIG_PACKAGE_${p} is not set" .config; then echo "  [已关闭] $p"; else echo "  [仍启用] $p"; fi
          done
          echo "=========== rust 依赖检查 ==========="
          for p in rust shadowsocks-rust-sslocal shadowsocks-rust-ssserver rustdesk-server python3-cryptography dns2socks-rust; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then echo "::warning::[rust 仍启用] ${p}"; else echo "  [已关闭] $p"; fi
          done
          if grep -q "^CONFIG_RUST_SCCACHE=y" .config; then echo "::warning::RUST_SCCACHE 仍开启"; else echo "  [已关闭] RUST_SCCACHE"; fi
          # 就地关闭：直接改写最终 .config（防止被 feeds/defconfig 重写丢失）
          disable_sym() {
            if grep -qE "^CONFIG_${1}=[ym]" .config; then
              sed -i -e "s/^CONFIG_${1}=y$/# CONFIG_${1} is not set/" \
                     -e "s/^CONFIG_${1}=m$/# CONFIG_${1} is not set/" .config
            fi
            grep -q "^# CONFIG_${1} is not set$" .config || echo "# CONFIG_${1} is not set" >> .config
          }
          for p in RUST_SCCACHE PACKAGE_rust PACKAGE_naiveproxy \
                   PACKAGE_shadowsocks-rust-sslocal PACKAGE_shadowsocks-rust-ssserver \
                   PACKAGE_shadowsocks-rust-ssmanager PACKAGE_shadowsocks-rust-ssservice PACKAGE_shadowsocks-rust-ssurl \
                   PACKAGE_rustdesk-server PACKAGE_luci-app-rustdesk-server \
                   PACKAGE_python3-cryptography PACKAGE_python3-cryptography-src PACKAGE_dns2socks-rust \
                   PACKAGE_luci-app-ssr-plus_INCLUDE_NaiveProxy \
                   PACKAGE_luci-app-passwall_INCLUDE_NaiveProxy PACKAGE_luci-app-passwall2_INCLUDE_NaiveProxy; do
            disable_sym "$p"
          done
          # sing-box 1.14.4 在 CI 上链接失败(collect2/ld)，且非用户点名包；连 paswall2 的 sing-box 核心一起关
          for p in PACKAGE_sing-box PACKAGE_luci-app-passwall2_Basic_Core_SingBox; do
            disable_sym "$p"
          done
          # chicken-scheme：Makefile 里把 $(CC) 当 make 目标（/No rule to make target/），与 ccache 包裹冲突
          for p in PACKAGE_chicken-scheme PACKAGE_chicken-scheme-interpreter PACKAGE_chicken-scheme-full; do
            disable_sym "$p"
          done
          # busybox 1.38：全量自定义 applet 与 kernel 6.18 UAPI 持续冲突。已逐项修 SELinux / EXTRA_COMPAT
          #           / WERROR / INETD_RPC / MOUNT_NFS / TC，仍在链接阶段 busybox_unstripped 失败。
          #           不再逐项打补丁：整段清掉自定义 applet 开关，退回 LEDE Config-defaults.in 官方默认集
          #           （即上游 CI 每日构建的组合，与 6.18 内核一致）
          sed -i -e '/^CONFIG_BUSYBOX_CONFIG_/d' -e '/^CONFIG_BUSYBOX_DEFAULT_/d' .config
          sed -i 's|^CONFIG_BUSYBOX_CUSTOM=y|# CONFIG_BUSYBOX_CUSTOM is not set|' .config
          grep -q '^# CONFIG_BUSYBOX_CUSTOM is not set$' .config || echo '# CONFIG_BUSYBOX_CUSTOM is not set' >> .config
          make defconfig
          echo "  [busybox] 自定义模式已关闭；残留自定义 applet 项: $(grep -c '^CONFIG_BUSYBOX_CONFIG_' .config) 个（应为 0）"
          echo "  [busybox] 默认项: $(grep -c '^CONFIG_BUSYBOX_DEFAULT_' .config) 个"
          if grep -q '^CONFIG_BUSYBOX_CONFIG_' .config; then echo "::error::busybox 自定义项未清空，配置回退失败"; exit 1; fi
          # 图形栈与路由器无关且极耗时：libmesa-llvmpipe / softpipe 会拉起 hostpkg LLVM 23
          # （x86 上 4 线程 × 数百个 C++ TU，单这一项就要 1.5h+，上一轮跑满 5h05 正是卡在这里）
          for p in PACKAGE_libmesa-llvmpipe PACKAGE_libmesa-softpipe PACKAGE_mesa PACKAGE_libglapi \
                   PACKAGE_libdrm PACKAGE_libwayland PACKAGE_wayland-protocols PACKAGE_vulkan-loader; do
            disable_sym "$p"
          done
          echo "  [图形栈] libmesa-llvmpipe / softpipe / drm / wayland 已关闭，避免编 hostpkg LLVM"
          # 真正把 LLVM 拉起来的是 mesa 这一个大包：libteflon-rocket(=m，RKNPU TFLite 委托) 一旦被选中，
          # mesa 的 PKG_BUILD_DEPENDS 就会连带编 hostpkg llvm-mesa（实测 1h41 还没编完，单这一项就撑爆 5h05）
          # 同时 mesa 还会拉 glslang/spirv-tools/wayland-protocols/libva/vulkan-headers 一整串
          for p in PACKAGE_libteflon-rocket PACKAGE_libteflon-etnaviv MESA_USE_LLVM; do
            disable_sym "$p"
          done
          # rust/host 是 shadowsocks-rust 的构建依赖，要全量编 hostpkg rustc（实测 1h13）
          # passwall 关掉 ss-rust 客户端后仍可用 xray/v2ray/go 内核，功能不受影响
          for p in PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client \
                   PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Rust_Client; do
            disable_sym "$p"
          done
          echo "  [耗时项] 已关闭 libteflon-rocket(mesa/LLVM) 与 passwall 的 ss-rust 客户端(hostpkg rustc)"
          # ccache 关闭：ccache 把 $(CC) 变两段（"ccache aarch64-..."），
          # 凡是把 $(CC) 当整体用的包（chicken-scheme、icu4c 的 runConfigureICU）都会挂；
          # 且实测命中率接近 0，纯开销。改成只缓存 dl 源码包
          sed -i 's|^CONFIG_CCACHE=y|# CONFIG_CCACHE is not set|' .config
          if grep -q "^# CONFIG_CCACHE is not set$" .config; then
            echo "  [已关闭] ccache（避免两段式 CC）"
          else
            echo "# CONFIG_CCACHE is not set" >> .config
            echo "  [已追加关闭] ccache"
          fi
          # 断掉 gn(host)：naiveproxy 换成无 gn 依赖的占位包
          if [ -d feeds/helloworld/naiveproxy ]; then
            echo '' | base64 -d > feeds/helloworld/naiveproxy/Makefile
            echo "  [已替换] naiveproxy -> 占位包（不再编 gn）"
          fi
          touch .config
          echo "=========== 终检 ==========="
          grep -q "^CONFIG_PACKAGE_naiveproxy=y" .config && echo "::warning::naiveproxy 仍启用（已用占位包规避 gn）" || true
          for p in rust shadowsocks-rust-sslocal rustdesk-server python3-cryptography dns2socks-rust; do
            grep -q "^CONFIG_PACKAGE_${p}=y" .config && echo "::warning::[仍启用] ${p}" || true
          done
          grep -q "^CONFIG_RUST_SCCACHE=y" .config && echo "::warning::RUST_SCCACHE 仍开启" || true
          echo "最终启用包数: $(grep -c '^CONFIG_PACKAGE_.*=y' .config)"

      - name: Patch hamlib (skip autoreconf)
        run: |
          cd lede
          HB=feeds/packages/utils/hamlib/Makefile
          if [ -f "$HB" ]; then
            sed -i '/^PKG_FIXUP:=autoreconf.*$/d' "$HB"
            if grep -q "PKG_FIXUP" "$HB"; then
              echo "::warning::hamlib 仍残留 PKG_FIXUP"
            else
              echo "  [已修补] hamlib: 移除 PKG_FIXUP:=autoreconf（改用源码包自带 configure）"
            fi
          else
            echo "  [跳过] 未找到 feeds/packages/utils/hamlib/Makefile"
          fi

      - name: Patch busybox (tolerate deprecated libselinux typedef)
        run: |
          cd lede
          BF=package/utils/busybox/Makefile
          if [ -f "$BF" ]; then
            if grep -q "Wno-deprecated-declarations" "$BF"; then
              echo "  [已存在] busybox CFLAGS 补丁"
            else
              sed -i '/^include $(INCLUDE_DIR)\/package.mk/i TARGET_CFLAGS += -Wno-deprecated-declarations' "$BF"
              grep -q "Wno-deprecated-declarations" "$BF" && echo "  [已修补] busybox: 忽略 deprecated-declarations（放行 security_context_t）" || echo "::warning::busybox 补丁未生效"
            fi
          else
            echo "  [跳过] 未找到 $BF"
          fi

      - name: Restore downloaded tarballs
        uses: actions/cache/restore@v4
        with:
          path: |
            lede/dl
          key: dl-${{ github.run_id }}
          restore-keys: |
            dl-

      - name: Patch download timeouts (stalled mirrors)
        run: |
          cd lede
          sed -i 's|curl -f --connect-timeout 20 --retry 5 --location|curl -f --connect-timeout 20 --max-time 900 --speed-limit 1024 --speed-time 60 --retry 5 --location|' scripts/download.pl
          grep -q -- '--speed-time 60' scripts/download.pl && echo "download.pl patched" || { echo "download.pl patch FAILED"; exit 1; }

      - name: Download source packages
        run: |
          cd lede
          rc=1
          tos="1200 900 600 600"
          i=1
          for to in $tos; do
            echo "== 下载尝试 $i（上限 ${to}s）=="
            timeout $to make -j8 download V=s > ../download-$i.log 2>&1
            rc=$?
            echo "attempt $i rc=$rc"
            tail -n 25 ../download-$i.log || true
            gzip -9 -c ../download-$i.log | split -b 10m - ../dl-log-$i- 2>/dev/null || true
            if [ $rc -eq 0 ]; then break; fi
            i=$((i+1))
          done
          if [ $rc -ne 0 ]; then
            echo "===== 下载失败，缺失文件 ====="
            grep -E 'No rule to make target|download failed|Hash mismatch|failed to download|is not available' ../download-*.log | tail -n 60 || true
            exit 1
          fi

      - name: Prepare sccache shim
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec "$@"\n' > "$HOME/.local/bin/sccache"
          chmod +x "$HOME/.local/bin/sccache"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/sccache" echo shim-ok

      - name: Build firmware
        run: |
          set +e
          cd lede
          mkdir -p ../out
          # 5h05 上限（< 6h job 硬上限），保证收尾 / 保存缓存 / 上传 artifact 步骤能正常执行
          LOGF=../build.log
          timeout --signal=TERM --kill-after=60 18300 make -j$(nproc) V=s > $LOGF 2>&1
          rc=$?
          echo "make exit code: $rc"
          if [ $rc -eq 124 ] || [ $rc -eq 137 ]; then
            echo "::warning::构建触及 5h05 上限（非编译错误，未完成）"
          fi
          # 构建一结束就立刻把诊断文件落到 out/，避免后续步骤被取消时日志全丢
          cp ../build.log ../build-all.log 2>/dev/null || true
          tail -n 12000 ../build-all.log > ../build-tail.txt 2>/dev/null
          cp ../build-tail.txt ../out/build-tail.txt 2>/dev/null || true
          ln=$(grep -nE 'make\[2\]: \*\*\* \[package/Makefile:[0-9]+: package/' $LOGF | head -1 | cut -d: -f1)
          if [ -z "$ln" ]; then
            ln=$(grep -nE 'make\[[0-9]+\]: \*\*\*|^ERROR|: error:' $LOGF | grep -v 'ignored' | grep -v 'stdc-predef' | head -1 | cut -d: -f1)
          fi
          if [ -n "$ln" ]; then
            a=$((ln-200)); [ $a -lt 1 ] && a=1
            b=$((ln+80))
            sed -n "${a},${b}p" $LOGF > ../fail-context.txt
            cp ../fail-context.txt ../out/fail-context.txt 2>/dev/null || true
            echo "===== 首个失败上下文（第 $a-$b 行）====="
            cat ../fail-context.txt
          else
            echo "===== 未定位到失败行，打印最后 200 行 ====="
            tail -n 200 ../build-all.log 2>/dev/null || true
          fi
          grep -nE "make\[[0-9]\]\: \*\*\*|: error:|Error [0-9]" ../build-all.log | tail -n 200 > ../out/build-errors.txt 2>/dev/null || true
          gzip -9 -c ../build-all.log | split -b 20m - ../out/log-part- 2>/dev/null || true
          ls -lh ../out/ 2>/dev/null || true
          exit $rc

      - name: Save downloaded tarballs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            lede/dl
          key: dl-${{ github.run_id }}

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          if [ -d lede/bin/targets/rockchip/armv8 ]; then
            cp lede/bin/targets/rockchip/armv8/*sysupgrade* out/ 2>/dev/null || true
            cp lede/bin/targets/rockchip/armv8/*.itb out/ 2>/dev/null || true
            cp lede/bin/targets/rockchip/armv8/*.bin out/ 2>/dev/null || true
          fi
          cp lede/.config out/BUILD-CONFIG.txt 2>/dev/null || true
          cp build-tail.txt out/build-tail.txt 2>/dev/null || true
          cp fail-context.txt out/fail-context.txt 2>/dev/null || true
          cp log-part-* out/ 2>/dev/null || true
          cp download-*.log dl-log-* out/ 2>/dev/null || true
          if [ -f build.log ]; then
            grep -nE "make\[[0-9]\]\: \*\*\*|: error:|Error [0-9]" build.log | tail -n 200 > out/build-errors.txt || true
            echo "== 首个报错上下文 =="
            grep -m1 -nE "make\[[0-9]\]\: \*\*\*|: error:" build.log || true
          fi
          ls -lh out/ || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r68s-lede-firmware
          path: out/
          retention-days: 30

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: r68s-${{ github.run_number }}
          name: "R68S LEDE 固件 #${{ github.run_number }}"
          files: out/*
          body: |
            **电犀牛 FastRhino R68S (RK3568) LEDE 固件**

            - 源码：coolsnowwolf/lede master
            - 集成：istore 应用商店 + Docker（LuCI: Dockerman）
            - 管理地址：http://192.168.6.1
            - 登录：root / password
            - 产物：`*squashfs-sysupgrade.img.gz`（可写 SD 卡，或 maskrom + rkdeveloptool 写 eMMC）

            > 首次启动后等 2-3 分钟再访问管理页。
